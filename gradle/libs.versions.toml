work = "2.12.0"
okhttp = "5.5.0"
credentials = "1.6.0"
googleid = "1.2.1"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
